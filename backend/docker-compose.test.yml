# Disposable PostgreSQL for the automated test suite. Data lives in tmpfs and is
# wiped when the container stops. It never touches your pos_system database.
#   docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
